$kind: http-request
order: 1000
url: 'http://localhost:3000/api/auth/login'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "email": "zainanas@gmail.com",
        "password": "zainanas21"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res && res.data && res.data.token) {
          pm.environment.set("TOKEN", res.data.token);
          console.log("✅ TOKEN saved to environment:", res.data.token.substring(0, 20) + "...");
      } else {
          console.warn("⚠️ Could not find token in response");
      }
